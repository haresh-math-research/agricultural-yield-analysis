[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agricultural-yield-analysis"
version = "2.0.0"
description = "Agricultural yield intelligence, forecasting, explainability and decision support."
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
